{% load static %}

{% block datatable_js %}
    <script src="https://code.jquery.com/jquery-3.7.1.slim.js"
    integrity="sha256-UgvvN8vBkgO0luPSUl2s8TIlOSYRoGFAX4jlCIm9Adc=" 
    crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
    crossorigin="anonymous"></script>
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
    integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
    crossorigin="anonymous"></script>
    
    <script type="text/javascript" src="https://cdn.datatables.net/2.1.2/js/dataTables.min.js"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/buttons/3.1.2/js/dataTables.buttons.min.js"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/buttons/3.1.1/js/buttons.dataTables.js"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/buttons/3.1.2/js/buttons.html5.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/select/2.0.5/js/dataTables.select.js"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/select/2.0.5/js/select.dataTables.js"></script>
{% endblock %}

{% block mytable_css %}
    <link rel="stylesheet" href="{% static 'stylesheets/mytable.css' %}" type="text/css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link href="https://cdn.datatables.net/2.1.2/css/dataTables.dataTables.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/3.1.2/css/buttons.dataTables.min.css" rel="stylesheet">
{% endblock %}

{% block datatable_script %}
    <script>
        $(document).ready(function () {
            $('#table').DataTable();
        });
        new DataTable('#table', {
            language: {
                lengthMenu: 'Display _MENU_ CIs',
                entries: {
                        _: 'CIs',
                        1: 'CI'
                }
            },
            scrollY: '450',
            responsive: true,
            lengthMenu: [100, 50, 25, 10],
            columnDefs: [
                {   targets: [1,2], 
                    render: function (Data, type, row)
                    {
                    tmp_data = Data.split("\\n").join("<br>")
                    return tmp_data.split("/").join("<br>")
                }
            },
            ],
            layout: {
                topStart: {
                    buttons: [
                        {
                            extend: 'collection', text: "Export", 
                            buttons: ["copy", "excel", "csv"]
                        }],
                    },
                topEnd: ['search'],
                bottomStart: ['pageLength', 'info'],
            },
            select: {style: 'os'}
        });
    </script>
{% endblock %}

{% block mytable %}
    <div class="tabledata">
        {{ data_table | safe }}
    </div>
{% endblock %}
